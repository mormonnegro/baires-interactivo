anchor="middle" font-size="15" font-weight="700" fill="#222">Fotos de época (Wikimedia Commons),</text><text x="185" y="710" text-anchor="middle" font-size="14" font-weight="400" fill="#222">aérea de 1940, planos de detalle,</text><text x="185" y="729" text-anchor="middle" font-size="14" font-weight="400" fill="#222">textos</text><rect x="420" y="20" width="330" height="70" rx="6" fill="#e3ecf5" stroke="#4a6a8f" stroke-width="1.6"/><text x="585" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#222">tools/1-clases.mjs</text><text x="585" y="60" text-anchor="middle" font-size="14" font-weight="400" fill="#222">respuesta al rayado en dos diagonales</text><text x="585" y="79" text-anchor="middle" font-size="14" font-weight="400" fill="#222">+ tono medio → 5 clases (1,35 m/px)</text><rect x="420" y="108" width="330" height="56" rx="6" fill="#e3ecf5" stroke="#4a6a8f" stroke-width="1.6"/><text x="585" y="131.5" text-anchor="middle" font-size="15" font-weight="700" fill="#222">tools/chicas.mjs</text><text x="585" y="150.5" text-anchor="middle" font-size="14" font-weight="400" fill="#222">casillas y árboles a resolución plena</text><rect x="420" y="200" width="330" height="56" rx="6" fill="#e3ecf5" stroke="#4a6a8f" stroke-width="1.6"/><text x="585" y="223.5" text-anchor="middle" font-size="15" font-weight="700" fill="#222">tools/geo.mjs</text><text x="585" y="242.5" text-anchor="middle" font-size="14" font-weight="400" fill="#222">afín por mínimos cuadrados, con descarte</text><rect x="420" y="300" width="330" height="76" rx="6" fill="#e3ecf5" stroke="#4a6a8f" stroke-width="1.6"/><text x="585" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#222">tools/calce.mjs</text><text x="585" y="343" text-anchor="middle" font-size="14" font-weight="400" fill="#222">calles de hoy contra las clases del paso 1,</text><text x="585" y="362" text-anchor="middle" font-size="14" font-weight="400" fill="#222">por ventanas de 420 m → afín + campo local</tex