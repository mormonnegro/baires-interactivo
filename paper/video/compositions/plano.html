        N.forEach((n, i) => {
          const m = Math.min(x0 - n[0], n[0] + n[2] - (x0 + w), y0 - n[1], n[1] + n[3] - (y0 + h));
          const op = i === 0 ? 1 : Math.max(0, Math.min(1, m / (0.05 * w)));
