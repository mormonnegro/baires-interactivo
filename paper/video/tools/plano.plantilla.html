  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // --- la cámara sobre el plano: centro (cx, cy) y ancho visible, en píxeles del escaneo ---
      const N = %%NIVELES%%; // [x, y, ancho, alto] de cada nivel, en el orden de las capas
      const CAPAS = ["#pl-n0", "#pl-n1", "#pl-n2", "#pl-n3", "#pl-n4", "#pl-n5", "#pl-n6"].map((s) => document.querySelector(s));
      const st = { cx: 9459.5, cy: 7951, lw: Math.log(18919), arc: 0, bump: 0 };
      function aplicar() {
        const w = Math.exp(st.lw + st.bump * Math.sin(Math.PI * st.arc)), h = (w * 9) / 16, x0 = st.cx - w / 2, y0 = st.cy - h / 2;
        N.forEach((n, i) => {
          const m = Math.min(x0 - n[0], n[0] + n[2] - (x0 + w), y0 - n[1], n[1] + n[3] - (y0 + h));
          const op = i === 0 ? 1 : Math.max(0, Math.min(1, m / (0.05 * w)));
          gsap.set(CAPAS[i], { x: ((n[0] - x0) / w) * 1920, y: ((n[1] - y0) / h) * 1080, scale: n[2] / w, autoAlpha: op });
        });
      }
      // (los valores se asignan por propiedades con «setter»: así la cámara se recalcula en cada cuadro buscado)
      const cam = {};
      Object.keys(st).forEach((k) => Object.defineProperty(cam, k, { get: () => st[k], set: (v) => { st[k] = v; aplicar(); } }));
      const K = (cx, cy, w, arc = 0, bump = 0) => ({ cx, cy, lw: Math.log(w), arc, bump });
      const vuela = (t, dur, de, a, ease) => tl.fromTo(cam, de, { ...a, duration: dur, ease, immediateRender: false }, t);
      vuela(0, 10.9, K(9459.5, 7951, 18919), K(9700, 8560, 12800), "none");
      vuela(10.9, 3.3, K(9700, 8560, 12800), K(9966, 9474, 440), "power3.inOut");
      vuela(15.2, 1.5, K(9966, 9474, 440), K(9904, 9420, 200), "power2.inOut");
      vuela(32.3, 2.3, K(9904, 9420, 200), K(9966, 9474, 700), "power2.inOut");
      vuela(34.9, 2.4, K(9966, 9474, 700, 0, 1.8), K(12170, 7191, 1000, 1, 1.8), "power2.inOut");
      vuela(46.7, 1.7, K(12170, 7191, 1000, 0, 2.0), K(9966, 9474, 487, 1, 2.0), "power3.inOut");
      aplicar();

      // un número que se escribe solo (también por «setter»)
      const numero = (sel, fmt, v0) => { const el = document.querySelector(sel), o = {}; let v = v0; Object.defineProperty(o, "v", { get: () => v, set: (x) => { v = x; el.textContent = fmt(x); } }); return o; };
      const coma = (x) => x.toFixed(1).replace(".", ",");

      // --- 1. el título ---
      tl.fromTo("#pl-t-anio", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.75);
      tl.fromTo("#pl-t-sub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.1);
      tl.fromTo("#pl-carta", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in", immediateRender: false }, 10.0);

      // --- 2. el rayado es un código ---
      const pasa = (sel, t) => tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, t);
      const sale = (sel, t, d = 0.2) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in", immediateRender: false }, t);
      pasa("#pl-cruz-in", 16.4); tl.fromTo("#pl-cruz-sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 17.15);
      pasa("#pl-simple-in", 18.55); tl.fromTo("#pl-simple-sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 19.55);
      sale("#pl-cruz-in", 21.2); sale("#pl-simple-in", 21.25);

      // --- 3. medir la textura ---
      tl.fromTo("#pl-px-in", { opacity: 0, scale: 0.9, transformOrigin: "55px 115px" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 23.3);
      sale("#pl-px-in", 26.4);
      tl.fromTo("#pl-vent-caja", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 26.9);
      tl.fromTo("#pl-d-a", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 28.8);
      tl.fromTo("#pl-d-b", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 29.05);
      tl.fromTo("#pl-vent-rot", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 30.3);
      tl.fromTo("#pl-vent-in", { x: 0, y: 0 }, { x: 1094, y: 77, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 30.5);
      sale("#pl-vent-in", 32.15);
      tl.fromTo("#pl-lect-in", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 28.65);
      tl.fromTo("#pl-b-a", { scaleX: 0 }, { scaleX: 17.3 / 34, duration: 0.45, ease: "power3.out" }, 28.8);
      tl.fromTo("#pl-b-b", { scaleX: 0 }, { scaleX: 24.1 / 34, duration: 0.45, ease: "power3.out" }, 29.05);
      tl.fromTo("#pl-v-a", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 28.8);
      tl.fromTo("#pl-v-b", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 29.05);
      tl.fromTo("#pl-v-edif", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 29.4);
      tl.fromTo("#pl-v-patio", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 28.6);
      // la ventana se corre al rayado simple: una diagonal se apaga
      tl.fromTo("#pl-v-edif", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, 30.55);
      tl.fromTo("#pl-b-a", { scaleX: 17.3 / 34 }, { scaleX: 3.1 / 34, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 30.5);
      tl.fromTo("#pl-b-b", { scaleX: 24.1 / 34 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 30.5);
      tl.fromTo(numero("#pl-v-a", coma, 17.3), { v: 17.3 }, { v: 3.1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 30.5);
      tl.fromTo(numero("#pl-v-b", coma, 24.1), { v: 24.1 }, { v: 34, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 30.5);
      tl.fromTo("#pl-d-a", { opacity: 1 }, { opacity: 0.22, duration: 0.4, immediateRender: false }, 30.8);
      tl.fromTo("#pl-v-patio", { opacity: 0 }, { opacity: 1, duration: 0.18, immediateRender: false }, 31.2);
      sale("#pl-lect-in", 32.65);
      // y clasifica cada punto
      tl.fromTo("#pl-clases", { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.9, ease: "power1.inOut" }, 32.4);
      tl.fromTo("#pl-ley1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 33.35);
      tl.fromTo("#pl-ley2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 33.55);
      sale("#pl-ley1", 34.8, 0.15); sale("#pl-ley2", 34.8, 0.15);
      tl.fromTo("#pl-clases", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 34.8);

      // --- 4. el calce de calles ---
      tl.fromTo("#pl-fino", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#pl-calles", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.6, ease: "power2.inOut" }, 37.3);
      tl.fromTo("#pl-osm-in", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 37.5);
      tl.fromTo("#pl-osm-f", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 37.4);
      tl.fromTo("#pl-cred-in", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 37.6);
      // ventana por ventana: las calles se corren a su lugar
      tl.fromTo("#pl-afin", { x: 0, y: 0, stroke: "#1d5fb4" }, { x: %%DX%%, y: %%DY%%, stroke: "#c2321c", duration: 1.1, ease: "power3.inOut", immediateRender: false }, 40.4);
      tl.fromTo("#pl-fino", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, 41.5);
      tl.fromTo("#pl-afin", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, 41.6);
      tl.fromTo("#pl-osm-a", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 41.1);
      tl.fromTo("#pl-osm-f", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 41.3);
      tl.fromTo("#pl-corr-in", { opacity: 0, scale: 1.25, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, 43.45);
      tl.fromTo(numero("#pl-corr-n", (x) => coma(x) + " m", 9.7), { v: 9.7 }, { v: 2.4, duration: 0.85, ease: "power2.inOut", immediateRender: false }, 44.95);
      sale("#pl-osm-in", 46.45, 0.25); sale("#pl-corr-in", 46.45, 0.25); sale("#pl-cred-in", 46.45, 0.25);
      tl.fromTo("#pl-calles", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, 46.5);

      // --- 5. de la lectura, los techos ---
      tl.fromTo("#pl-techos", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 48.15);
      window.__timelines["plano"] = tl;
    })();
